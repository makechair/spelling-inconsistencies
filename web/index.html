<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>US Stocks</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand brand-link" href="/">US&nbsp;Stocks</a>
  <a class="topbar-link" href="/reports">分析レポート</a>
  <a class="topbar-link" href="/coverage">データ蓄積状況</a>

  <div class="search">
    <input id="search-input" type="search" placeholder="ティッカー / 企業名で検索" autocomplete="off"
           aria-label="銘柄検索">
    <ul id="search-results" class="search-results" hidden></ul>
  </div>

  <label class="tz" for="tz-select">
    <span class="visually-hidden">表示時間帯</span>
    <select id="tz-select" title="チャートと時刻の表示に使う時間帯">
      <option value="America/New_York">市場時間 (ET)</option>
      <option value="Asia/Tokyo">日本時間 (JST)</option>
      <option value="local">ブラウザの時間帯</option>
      <option value="UTC">UTC</option>
    </select>
  </label>

  <div class="conn" id="conn-indicator" title="データ受信状態">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-label">接続中…</span>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <h2>ウォッチリスト</h2>
    <ul id="watchlist" class="watchlist"></ul>
    <p class="hint" id="watchlist-hint">検索して銘柄を追加してください。</p>
  </aside>

  <section class="content">
    <div class="quote" id="quote">
      <div class="quote-main">
        <span class="symbol" id="quote-symbol">—</span>
        <span class="name" id="quote-name"></span>
      </div>
      <div class="quote-price">
        <span class="last" id="quote-last">—</span>
        <span class="change" id="quote-change"></span>
      </div>
      <dl class="quote-meta">
        <div><dt>セッション</dt><dd id="quote-session">—</dd></div>
        <div><dt>最終受信</dt><dd id="quote-updated">—</dd></div>
        <div>
          <dt title="収集側が最後にデータ取得を完了した時刻。約定が無くても更新される">最終確認</dt>
          <dd id="quote-checked">—</dd>
        </div>
      </dl>
    </div>

    <div class="range-bar" role="group" aria-label="表示期間">
      <button type="button" id="grid-view-button" class="grid-view-button" hidden>4分割</button>
      <button type="button" data-days="1">1D</button>
      <button type="button" data-days="7">7D</button>
      <button type="button" data-days="30">1M</button>
      <button type="button" data-days="365">1Y</button>
      <label class="toggle">
        <input type="checkbox" id="extended-toggle" checked>
        時間外を含む
      </label>
      <label class="toggle">
        <input type="checkbox" id="ma-toggle">
        移動平均
      </label>
      <a id="export-link" class="export" href="#" download>CSV</a>
    </div>

    <div id="chart-grid" class="chart-grid" aria-label="1D・7D・1M・1Yチャート">
      <article class="chart-panel" data-chart-days="1">
        <button type="button" class="chart-panel-header" data-expand-days="1"
                aria-label="1Dチャートを拡大表示">
          <span class="chart-period">1D</span>
          <span class="chart-summary" id="chart-summary-1"></span>
          <span class="chart-expand-hint" aria-hidden="true">拡大</span>
        </button>
        <div id="chart-1" class="chart chart-compact"></div>
      </article>
      <article class="chart-panel" data-chart-days="7">
        <button type="button" class="chart-panel-header" data-expand-days="7"
                aria-label="7Dチャートを拡大表示">
          <span class="chart-period">7D</span>
          <span class="chart-summary" id="chart-summary-7"></span>
          <span class="chart-expand-hint" aria-hidden="true">拡大</span>
        </button>
        <div id="chart-7" class="chart chart-compact"></div>
      </article>
      <article class="chart-panel" data-chart-days="30">
        <button type="button" class="chart-panel-header" data-expand-days="30"
                aria-label="1Mチャートを拡大表示">
          <span class="chart-period">1M</span>
          <span class="chart-summary" id="chart-summary-30"></span>
          <span class="chart-expand-hint" aria-hidden="true">拡大</span>
        </button>
        <div id="chart-30" class="chart chart-compact"></div>
      </article>
      <article class="chart-panel" data-chart-days="365">
        <button type="button" class="chart-panel-header" data-expand-days="365"
                aria-label="1Yチャートを拡大表示">
          <span class="chart-period">1Y</span>
          <span class="chart-summary" id="chart-summary-365"></span>
          <span class="chart-expand-hint" aria-hidden="true">拡大</span>
        </button>
        <div id="chart-365" class="chart chart-compact"></div>
      </article>
    </div>
    <p class="chart-note" id="chart-note"></p>
  </section>
</main>

<footer class="footer">
  <span id="footer-status"></span>
</footer>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
