name: deploy

# Infrastructure changes on main run the checks, then apply Terraform. A normal
# application-only push is deployed by the host pull agent and intentionally
# does not consume a GitHub Actions run.
#
# The application itself is not shipped from here: the instance pulls it
# (deploy/agent/). A runner has no fixed egress address, so pushing over SSH
# would require opening port 22 to the internet, which contradicts the
# closed-ingress design (spec 4.5).
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan rather than only showing it
        type: boolean
        default: false

# Serialise deploys. Two applies against one state file would fight over the
# lock and leave the second run failing on a stale plan.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.15.8"
  TF_WORKING_DIR: infra/terraform
  AWS_REGION: ap-northeast-1

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q

  # Syntax and schema checks that need no AWS credentials, so they can run on
  # a pull request. The apply job below cannot: see its comment.
  terraform-check:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init without a backend
        # -backend=false skips state access, which is what makes this runnable
        # without credentials. It still downloads the provider, so validate
        # checks resource and attribute names against the real schema.
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  apply:
    name: terraform apply
    needs: [test, terraform-check]
    # Only a push to main, or a manual run with apply checked.
    #
    # Deliberately not run on pull requests: the deploy role's trust policy
    # pins sub=repo:OWNER/REPO:ref:refs/heads/main, and a pull request presents
    # sub=repo:OWNER/REPO:pull_request, so AssumeRole would fail every time.
    # Widening the trust to accept pull_request would hand plan-capable
    # credentials to any PR, so the narrow trust is kept and PRs stop at
    # terraform-check. Plan-on-PR would need a separate read-only role.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # No stored access keys: short-lived credentials from OIDC.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Plan
        # aws_profile is emptied: a runner has no ~/.aws/config, so leaving the
        # dev01 default would fail with a missing-profile error.
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan \
            -var="aws_profile=" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var='ssh_allowed_cidrs=${{ vars.SSH_ALLOWED_CIDRS }}' \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="create_github_oidc_provider=${{ vars.CREATE_OIDC_PROVIDER || 'false' }}"
          terraform show -no-color tfplan > plan.txt

      - name: Summarise the plan
        run: |
          {
            echo '### Terraform plan'
            echo '```terraform'
            # Truncated: a full plan can exceed the 1 MB step-summary limit.
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Publish outputs
        run: |
          {
            echo '### Applied outputs'
            echo '```'
            # Outputs here are identifiers and ARNs only; the configuration
            # deliberately creates no secret values (see backup.tf).
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
